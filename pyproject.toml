[project]
name = "mocktaxii"
version = "1.1.4"
description = "TAXII 2.x server for testing threat intelligence integrations, primarily the Palo Alto Networks Cortex Platform (XSIAM, XSOAR)"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "flask-limiter>=4.1.1",
    "gunicorn>=26.0.0",
    "psycopg2-binary>=2.9.13",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.53",
    "stix2-validator==3.2.0",
    "werkzeug>=3.1.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
