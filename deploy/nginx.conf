# MockTAXII v1.1.4 - Production Nginx Configuration
# High-performance reverse proxy with security headers

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # NB: no Content-Security-Policy here on purpose. The application sets one
    # in routes.py add_security_headers(), and it is the only copy that knows
    # what the templates load. Every asset is served from the application
    # origin, so that policy names no host at all; a second policy here would
    # be intersected with it by the browser and could only narrow it further.
    
    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript
               application/taxii+json application/stix+json;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=web:10m rate=50r/s;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    upstream mocktaxii_backend {
        server web:5000;
        keepalive 32;
    }
    
    server {
        listen 80;
        server_name _;
        
        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }
    
    server {
        listen 443 ssl;
        http2 on;
        server_name _;
        
        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # Client settings
        client_max_body_size 10M;
        client_body_timeout 30s;
        client_header_timeout 30s;
        
        # TAXII API endpoints with stricter rate limiting
        location /taxii2/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://mocktaxii_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # TAXII-specific headers
            proxy_set_header Content-Type "application/taxii+json;version=2.1";
            proxy_set_header Accept "application/taxii+json;version=2.1";
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 180s;
        }
        
        # Web interface with standard rate limiting
        location / {
            limit_req zone=web burst=100 nodelay;
            
            proxy_pass http://mocktaxii_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 180s;
        }
        
        # Health check endpoint. Keep it on the application path so a 200
        # also confirms that Flask can reach PostgreSQL; do not return a
        # synthetic proxy-level success when the backend is unhealthy.
        #
        # It is exempt from Flask-Limiter by design, so the edge is the only
        # limit it has. Without one this is an unauthenticated route that runs
        # SELECT 1 against the connection pool as fast as anyone can call it.
        # The container HEALTHCHECK uses localhost:5000 and never comes
        # through here.
        location = /healthz {
            limit_req zone=web burst=5 nodelay;
            access_log off;
            proxy_pass http://mocktaxii_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}